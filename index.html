<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>MOTÍVUMALKOTÓ</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600&display=swap" rel="stylesheet"/>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>

    <style>
        html, body {
            margin: 0; padding: 0; width: 100%; height: 100%;
            background-color: #f9f9f9 !important;
            font-family: 'Montserrat', sans-serif;
            overflow: hidden;
            display: flex; flex-direction: column;
        }

        header {
            height: 80px; display: flex; justify-content: space-between; align-items: center;
            padding: 0 64px; border-bottom: 1px solid #E5E5E5; background-color: #f9f9f9;
            flex-shrink: 0;
        }

        .nav-links { display: flex; gap: 48px; } /* Menüpontok közti távolság */
        .nav-links a, .btn-primary { 
            text-decoration: none; font-size: 12px; font-weight: 600; 
            letter-spacing: 2px; color: #5e5e5e; text-transform: uppercase;
        }
        .btn-primary { background: #000; color: #fff; padding: 12px 32px; }

        main { flex-grow: 1; position: relative; overflow: hidden; background-color: #f9f9f9; }

        .parallax-layer {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background-size: cover; background-position: center bottom;
            background-repeat: repeat-x;
        }

        footer {
            height: 50px; background: #ffffff; border-top: 1px solid #E5E5E5;
            display: flex; justify-content: space-between; align-items: center;
            padding: 0 64px; font-family: 'Montserrat', sans-serif;
            font-size: 14px; color: #000; flex-shrink: 0;
        }
        footer a { color: #000; text-decoration: none; font-weight: 600; }
        footer a:hover { text-decoration: underline; }
    </style>
</head>
<body>

    <header>
        <div style="font-size: 24px; font-weight: 500;">MOTIVUMLÉNYEK</div>
        <div class="nav-links">
            <a href="https://motivumalkoto.hu/about" target="_blank" rel="noopener noreferrer">BACKGROUND</a>
            <a href="https://motivumalkoto.hu/gallery" target="_blank" rel="noopener noreferrer">ABOUT</a>
            <a href="https://www.motivumalkoto.hu" target="_blank" rel="noopener noreferrer" class="btn-primary">MOTIVUMALKOTÓ</a>
        </div>
    </header>

    <main>
        <div class="parallax-layer" id="layer-bg" style="background-image: url('MotivumCsapat_backArtboard 1.png'); z-index: 10;"></div>
        <div class="parallax-layer" id="layer-fg" style="background-image: url('MotivumCsapat_frontArtboard 1.png'); z-index: 30;"></div>
    </main>

    <footer>
        <div>© 2026 MOTIVUMALKOTÓ</div>
        <a href="https://www.instagram.com/motifcreator" target="_blank" rel="noopener noreferrer">INSTAGRAM</a>
    </footer>

    <script>
        const bg = document.getElementById('layer-bg');
        const fg = document.getElementById('layer-fg');
        
        let mouseX = 0;
        let currentPos = 0;
        let speed = 0;

        window.addEventListener('mousemove', (e) => {
            mouseX = (e.clientX / window.innerWidth) * 2 - 1;
        });

        gsap.ticker.add(() => {
            speed = mouseX * 3; 
            currentPos += speed;

            gsap.set(bg, { backgroundPositionX: currentPos * 0.2 + "px" });
            gsap.set(fg, { backgroundPositionX: currentPos * 0.8 + "px" });
        });
    </script>
</body>
</html>
