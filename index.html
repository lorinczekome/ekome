<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>MOTÍVUMALKOTÓ</title>
    
    <!-- Betöltjük a 400, 500, 600 és a 700-as Montserrat verziót is -->
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet"/>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>

    <style>
        html, body {
            margin: 0; padding: 0; width: 100%; height: 100%;
            background-color: #f9f9f9 !important;
            font-family: 'Montserrat', sans-serif;
            overflow: hidden;
            display: flex; flex-direction: column;
        }

        header {
            height: 80px; display: flex; justify-content: space-between; align-items: center;
            padding: 0 32px; border-bottom: 1px solid #E5E5E5; background-color: #f9f9f9;
            flex-shrink: 0; z-index: 1000;
            transition: height 0.3s ease;
        }

        .logo-text { 
            font-size: 20px; font-weight: 500; /* Vékonyabb (500-as) betű */
            display: flex; align-items: center; flex-direction: row; gap: 6px;
        }
        
        #logo-suffix {
            display: inline-block;
        }

        .nav-container { display: flex; align-items: center; gap: 32px; }
        .hamburger { display: none; cursor: pointer; flex-direction: column; gap: 5px; z-index: 1001; }
        .hamburger div { width: 25px; height: 2px; background: #000; transition: all 0.3s; }

        @media (max-width: 900px) {
            header { height: 100px; } /* Vastagabb fejléc mobilon */
            .nav-container { display: none; }
            .hamburger { display: flex; }
            
            .logo-text { 
                flex-direction: column; align-items: flex-start; justify-content: center; 
                gap: 2px; font-size: 16px; /* 2 soros megjelenítés, picit kisebb betűvel, hogy jól elférjen */
            }
        }

        /* Slide-in animáció a mobil menünek */
        #mobile-menu {
            position: fixed; top: 0; right: -100%; width: 100%; height: 100%;
            background: #000000; display: flex; flex-direction: column; align-items: center; justify-content: center;
            gap: 40px; z-index: 999;
            transition: right 0.5s ease-in-out;
        }
        #mobile-menu.open { right: 0; }

        /* X ikon animáció - marad fekete */
        .hamburger.active div:nth-child(1) { transform: rotate(45deg) translate(7px, 6px); }
        .hamburger.active div:nth-child(2) { opacity: 0; }
        .hamburger.active div:nth-child(3) { transform: rotate(-45deg) translate(7px, -6px); }

        .mobile-nav-link { text-decoration: none !important; color: #E8E8E8; font-size: 18px; font-weight: 600; text-transform: uppercase; letter-spacing: 2px; }
        .nav-link { text-decoration: none !important; font-size: 14px; font-weight: 600; color: #5e5e5e; text-transform: uppercase; transition: opacity 0.3s ease; }
        .nav-link:hover { opacity: 0.5; }
        
        .btn-primary { 
            background: #000; color: #e0e0e0; padding: 12px 32px; 
            text-decoration: none !important; font-size: 12px; font-weight: 600; letter-spacing: 1px; 
            transition: all 0.3s ease;
            border-radius: 0px;
        }
        .btn-primary:hover { 
            background: #333; color: #ffffff; border-radius: 12px; 
            padding: 16px 32px; /* 4-4 px növelés alul-felül */
        }

        #mobile-menu .btn-primary {
            border: 1px solid #888888; /* Középszürke outline csak a mobil menüben */
        }

        main { flex-grow: 1; position: relative; overflow: hidden; background-color: #f9f9f9; }
        .parallax-layer { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background-size: cover; background-position: center bottom; background-repeat: repeat-x; }

        /* Dombos minimalista háttér - 3 különböző magasságú domb */
        #hills-container {
            position: absolute; bottom: 0; left: 0; width: 100%; height: 50%; z-index: 5; pointer-events: none; overflow: hidden;
        }
        .hill { position: absolute; background-color: #e8e8e8; border-radius: 50%; }
        .hill-1 { width: 150vw; height: 100vh; left: -30vw; top: 40%; } /* Közepes, bal oldali */
        .hill-2 { width: 120vw; height: 130vh; left: 15vw; top: 20%; }  /* Magas, középső */
        .hill-3 { width: 160vw; height: 80vh; left: 45vw; top: 55%; }   /* Alacsonyabb, lankás jobb oldali */

        /* Lebegő SVG vektorok alapstílusa */
        .floating-svg {
            position: absolute;
            pointer-events: none; /* Ne akadályozza az egérkattintásokat */
            will-change: transform, opacity;
        }

        footer { height: 50px; background: #ffffff; border-top: 1px solid #E5E5E5; display: flex; justify-content: space-between; align-items: center; padding: 0 32px; font-size: 12px; flex-shrink: 0; }
        footer a { color: #000; text-decoration: none; font-weight: 600; transition: opacity 0.3s ease; }
        footer a:hover { opacity: 0.6; }
    </style>
</head>
<body>

    <header>
        <div class="logo-text">
            <span>BEMUTATKOZNAK A</span>
            <span>MOTÍVUM<span id="logo-suffix">LÉNYEK</span></span>
        </div>
        <div class="nav-container">
            <a href="https://neprajz.hu/hirek/2022/keszits-sajat-designt-a-neprajzi-muzeum-uj-alkalmazasaval.html" target="_blank" rel="noopener noreferrer" class="nav-link">A PROJEKTRŐL</a>
            <a href="https://www.motivumalkoto.hu" target="_blank" rel="noopener noreferrer" class="btn-primary">MOTÍVUMALKOTÓ</a>
        </div>
        <div class="hamburger" id="hamburger" onclick="toggleMenu()">
            <div></div><div></div><div></div>
        </div>
    </header>

    <div id="mobile-menu">
        <a href="https://neprajz.hu/hirek/2022/keszits-sajat-designt-a-neprajzi-muzeum-uj-alkalmazasaval.html" target="_blank" rel="noopener noreferrer" class="mobile-nav-link">A PROJEKTRŐL</a>
        <a href="https://www.motivumalkoto.hu" target="_blank" rel="noopener noreferrer" class="btn-primary">MOTÍVUMALKOTÓ</a>
    </div>

    <main id="main-container">
        <!-- Minimalista dombok (z-index: 5) -->
        <div id="hills-container">
            <div class="hill hill-1"></div>
            <div class="hill hill-2"></div>
            <div class="hill hill-3"></div>
        </div>
        
        <!-- Háttér PNG (z-index: 10) -->
        <div class="parallax-layer" id="layer-bg" style="background-image: url('MotivumCsapat_backArtboard 1.png'); z-index: 10;"></div>
        <!-- Előtér PNG (z-index: 30) -->
        <div class="parallax-layer" id="layer-fg" style="background-image: url('MotivumCsapat_frontArtboard 1.png'); z-index: 30;"></div>
    </main>

    <footer>
        <div>© 2026 MOTÍVUMALKOTÓ</div>
        <a href="https://www.instagram.com/motifcreator" target="_blank" rel="noopener noreferrer">INSTAGRAM</a>
    </footer>

    <script>
        // 1. Menü logikája
        function toggleMenu() {
            const menu = document.getElementById('mobile-menu');
            const hamburger = document.getElementById('hamburger');
            menu.classList.toggle('open');
            hamburger.classList.toggle('active');
        }

        // 2. Szó rotáló animáció a fejlécben
        const suffixWords = [
            'LÉNYEK', 'SZELLEMEK', 'EMBEREK', 'ANGYALOK', 
            'ASSZONYOK', 'BETYÁROK', 'FÉRFIAK', 'SZERETŐK', 
            'CSECSEMŐK', 'ISTENEK', 'GYEREKEK', 'ARCOK',
            'HUSZÁROK', 'LEÁNYOK', 'MISKÁK', 'ÖRDÖGÖK'
        ];
        let currentWordIndex = 0;
        const suffixElement = document.getElementById('logo-suffix');

        function animateSuffix() {
            let nextIndex = currentWordIndex;
            while (nextIndex === currentWordIndex) {
                nextIndex = Math.floor(Math.random() * suffixWords.length);
            }
            currentWordIndex = nextIndex;

            gsap.to(suffixElement, {
                y: -15, opacity: 0, duration: 0.3, ease: "power2.in", onComplete: () => {
                    suffixElement.innerText = suffixWords[currentWordIndex];
                    gsap.set(suffixElement, { y: 15 });
                    
                    gsap.to(suffixElement, {
                        y: 0, opacity: 1, duration: 0.3, ease: "power2.out", onComplete: () => {
                            setTimeout(animateSuffix, 1500);
                        }
                    });
                }
            });
        }
        
        setTimeout(animateSuffix, 1500);


        // 3. Parallax logikája
        const bg = document.getElementById('layer-bg');
        const fg = document.getElementById('layer-fg');
        let mouseX = 0;
        let currentPos = 0;

        // Proximity (Távolság alapú nagyítás) egerének koordinátái
        let mouseXpx = -1000; 
        let mouseYpx = -1000;

        window.addEventListener('mousemove', (e) => {
            mouseX = (e.clientX / window.innerWidth) * 2 - 1;
            mouseXpx = e.clientX;
            mouseYpx = e.clientY;
        });

        let frame = 0;
        gsap.ticker.add(() => {
            frame++;
            if (window.innerWidth < 900) {
                // Tovább lassított automatikus mozgás
                gsap.set(bg, { backgroundPositionX: (frame * 0.35) + "px" });
                gsap.set(fg, { backgroundPositionX: (frame * 1.05) + "px" });
            } else {
                // Tovább lassított egérkövető mozgás
                currentPos += mouseX * 2.15;
                gsap.set(bg, { backgroundPositionX: currentPos * 0.2 + "px" });
                gsap.set(fg, { backgroundPositionX: currentPos * 0.8 + "px" });
            }

            // --- PROXIMITY PULSE EFFEKT ---
            const svgs = document.querySelectorAll('.floating-svg');
            const triggerDist = 200; // Hatósugár pixelben

            svgs.forEach(svg => {
                const rect = svg.getBoundingClientRect();
                
                // Távolság kiszámítása az SVG befoglaló dobozának a legközelebbi pontjától
                const dx = Math.max(rect.left - mouseXpx, 0, mouseXpx - rect.right);
                const dy = Math.max(rect.top - mouseYpx, 0, mouseYpx - rect.bottom);
                const dist = Math.hypot(dx, dy);
                
                // Ha a kurzor a hatósugáron belül van, és még nem animál/nem volt animálva a közelmúltban
                if (dist < triggerDist && !svg._isPulsing && !svg._hasPulsed) {
                    svg._isPulsing = true;
                    svg._hasPulsed = true; // Jelezzük, hogy ez a hover esemény már lefutott
                    
                    // Finom növekedés és visszacsökkenés (10%)
                    gsap.to(svg, {
                        scale: 1.1,
                        duration: 0.6,
                        ease: "power2.inOut",
                        yoyo: true, // Automatikusan visszajátssza
                        repeat: 1,  // Egyszer ismétli (tehát nő, majd csökken)
                        onComplete: () => {
                            svg._isPulsing = false;
                        }
                    });
                } else if (dist >= triggerDist && svg._hasPulsed && !svg._isPulsing) {
                    // Ha az egér eltávolodott és az animáció már lefutott, reseteljük, hogy újra triggerelhető legyen
                    svg._hasPulsed = false;
                }
            });
        });

        // 4. Lebegő SVG Vektorok logikája
        const svgFiles = [
            '12510_vektor_01.svg',
            '43342_vektor_01.svg',
            'NM_81.137.1_vektor_01.svg',
            '130864_A_vektor_01.svg',
            '37766.svg',
            '121719_A_vektor_02.svg',
            '134432_A_vektor_01.svg',
            '129517_vektor_01_asset.svg',
            '71.30.134_vektor_01_variacio.svg',
            '94.17.1_vektor_01_variacio.svg',
            '32041_A_vektor_01_variacio.svg',
            '134261_C_vektor_03.svg',
            '121719_A_vektor_01.svg',
            '110667_B_vektor_01.svg',
            '134290b(2)_vektor_01.svg',
            '54.55.56_B.svg',
            '16489 (2).svg',
            '64277(3).svg'
        ];

        // Képernyő foglaltságának ellenőrzése
        let isScreenOccupied = false;

        function spawnRandomSvg() {
            if (isScreenOccupied) {
                setTimeout(spawnRandomSvg, 1000); 
                return;
            }
            isScreenOccupied = true;

            const mainContainer = document.getElementById('main-container');
            const el = document.createElement('img');
            
            const chosenSvg = svgFiles[Math.floor(Math.random() * svgFiles.length)];
            el.src = chosenSvg;
            el.className = 'floating-svg';
            el.style.zIndex = 40;

            mainContainer.appendChild(el);

            const headerHeight = document.querySelector('header').offsetHeight;
            let svgHeight = gsap.utils.random(700, 1300);
            const maxAvailableHeight = window.innerHeight - headerHeight;
            if (svgHeight > maxAvailableHeight) {
                svgHeight = maxAvailableHeight;
            }
            
            let direction = Math.random() > 0.5 ? 1 : -1; 
            
            const rightOnlyFiles = ['130864_A_vektor_01.svg', '134261_C_vektor_03.svg', '54.55.56_B.svg', '16489 (2).svg'];
            if (rightOnlyFiles.includes(chosenSvg)) {
                direction = -1;
            }
            
            const startXPercent = direction === 1 ? -150 : 50; 
            
            // Finomított célpozíció: Annyira jönnek be, hogy a teljes SVG látszódjon a képernyőn
            let targetXPercent;
            if (direction === 1) {
                targetXPercent = gsap.utils.random(5, 10); // Balról beljebb ér (pozitív 5-10% ráhagyás)
            } else {
                targetXPercent = gsap.utils.random(-110, -105); // Jobbról teljesen beér (-100% jelenti az elem jobb szélét)
            }
            
            const horizontalAnchor = direction === 1 ? "0%" : "100%";
            
            const stayDuration = gsap.utils.random(3, 4); 
            const slideDuration = 3.2; // Lassított becsúszás (2.5-ről növelve)

            gsap.set(el, {
                bottom: "0px",
                left: horizontalAnchor,
                height: `${svgHeight}px`,
                width: 'auto',
                opacity: 1, 
                xPercent: startXPercent,
                yPercent: 0, 
                rotation: 0, 
                transformOrigin: "bottom center"
            });

            const tl = gsap.timeline({
                onComplete: () => {
                    el.remove(); 
                    isScreenOccupied = false;
                    setTimeout(spawnRandomSvg, gsap.utils.random(300, 1500));
                }
            });

            tl.to(el, { xPercent: targetXPercent, duration: slideDuration, ease: "power2.inOut" })
              .to(el, { xPercent: startXPercent, duration: slideDuration, ease: "power2.inOut" }, `+=${stayDuration}`);
        }

        setTimeout(spawnRandomSvg, 500);

        // 5. Különleges felülről bekukucskáló SVG logikája
        const topPeekerFiles = [
            '2023.80.12_C_vektor_01_arc.svg',
            '13447_vektor_01_variacio.svg',
            '65.113.3_01_variacio.svg',
            '2020.18.10_vektor_01_variacio.svg',
            '140971_M_vektor_01_variacio.svg'
        ];

        function spawnTopPeekerSvg() {
            if (isScreenOccupied) {
                setTimeout(spawnTopPeekerSvg, 1000); 
                return;
            }
            isScreenOccupied = true;

            const mainContainer = document.getElementById('main-container');
            const el = document.createElement('img');
            
            el.src = topPeekerFiles[Math.floor(Math.random() * topPeekerFiles.length)];
            el.className = 'floating-svg';
            el.style.zIndex = 40; 

            mainContainer.appendChild(el);

            const headerHeight = document.querySelector('header').offsetHeight;
            const mainHeight = window.innerHeight - headerHeight;
            
            // A magasságot kétharmadára (2/3) csökkentettük (165px és 335px között)
            let peekerHeight = gsap.utils.random(165, 335); 
            if (peekerHeight > mainHeight) peekerHeight = mainHeight;

            gsap.set(el, {
                top: 0,
                left: `${gsap.utils.random(10, 90)}%`, 
                height: `${peekerHeight}px`,
                width: 'auto',
                xPercent: -50,
                yPercent: -100, 
                y: 0,
                opacity: 1,
                rotation: 0
            });

            const maxVisiblePixels = Math.min(peekerHeight * 0.75, mainHeight / 2);
            const stayDuration = gsap.utils.random(2, 3); 
            const slideDuration = 2.5; 

            const tl = gsap.timeline({
                onComplete: () => {
                    el.remove();
                    isScreenOccupied = false;
                    setTimeout(spawnTopPeekerSvg, gsap.utils.random(10000, 20000));
                }
            });

            tl.to(el, { y: maxVisiblePixels, duration: slideDuration, ease: "power2.inOut" })
              .to(el, { y: 0, duration: slideDuration, ease: "power2.inOut" }, `+=${stayDuration}`);
        }

        setTimeout(spawnTopPeekerSvg, gsap.utils.random(10000, 20000));

        // 6. Átrepülő (Flying) SVG logikája
        const flyingFiles = [
            '106711_vektor_10.svg',
            '61.47.52_A_vektor_01.svg'
        ];

        function spawnFlyingSvg() {
            const mainContainer = document.getElementById('main-container');
            const el = document.createElement('img');
            
            const chosenFly = flyingFiles[Math.floor(Math.random() * flyingFiles.length)];
            el.src = chosenFly;
            el.className = 'floating-svg';
            el.style.zIndex = 7; 

            mainContainer.appendChild(el);

            const headerHeight = document.querySelector('header').offsetHeight;
            const mainHeight = window.innerHeight - headerHeight;
            
            let flyHeight = gsap.utils.random(mainHeight * 0.15, mainHeight * 0.25);

            // Ha ez a specifikus repülő van soron, 10%-kal növeljük a méretét
            if (chosenFly === '106711_vektor_10.svg') {
                flyHeight *= 1.10;
            }

            gsap.set(el, {
                top: '50%',
                left: '100%',
                height: `${flyHeight}px`,
                width: 'auto',
                xPercent: 0,
                yPercent: -50, 
                opacity: 1,
                rotation: 0 
            });

            const flyDuration = gsap.utils.random(8, 12); 

            const tl = gsap.timeline({
                onComplete: () => {
                    el.remove();
                    setTimeout(spawnFlyingSvg, gsap.utils.random(20000, 30000));
                }
            });

            tl.to(el, { left: '0%', xPercent: -100, duration: flyDuration, ease: "none" });
        }

        setTimeout(spawnFlyingSvg, gsap.utils.random(5000, 15000));

    </script>
</body>
</html>
